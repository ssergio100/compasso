<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="br.com.tempo.Agent"/>
  </policy>
  <policy context="default">
    <allow send_destination="br.com.tempo.Agent"
           send_interface="br.com.tempo.Agent"
           send_member="AddLocalBonus"/>
    <allow send_destination="br.com.tempo.Agent"
           send_interface="br.com.tempo.Agent"
           send_member="GetSynchronizationStatus"/>
    <allow send_destination="br.com.tempo.Agent"
           send_interface="br.com.tempo.Agent"
           send_member="GetSynchronizationReport"/>
  </policy>
</busconfig>
