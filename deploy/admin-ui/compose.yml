services:
  compasso-admin-ui:
    image: nginx:alpine
    container_name: compasso-admin-ui
    restart: unless-stopped
    ports:
      - "${COMPASSO_ADMIN_BIND_ADDRESS:-0.0.0.0}:${COMPASSO_ADMIN_PORT:-8182}:80"
    volumes:
      - ${COMPASSO_ADMIN_UI_DIRECTORY:-/srv/sites/compasso-admin-ui}:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
