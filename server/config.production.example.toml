# A imagem Docker pode receber conexões pela rede configurada pelo Compose.
listen_address = "0.0.0.0:8080"
database_path = "/var/lib/tempo-server/tempo-server.db"
online_timeout = "60s"
session_lifetime = "8h"

# Exemplo para uma implantação HTTPS com frontend e API em origens diferentes.
secure_cookies = true
admin_origin = "https://admin.example.com"
