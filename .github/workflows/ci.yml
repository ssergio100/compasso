name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes sqlite3 python3-gi gir1.2-gtk-4.0

      - name: Install frontend dependencies
        run: npm ci --prefix admin-ui

      - name: Run checks
        run: make test
