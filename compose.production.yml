services:
  tempo-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - tempo-server-data:/var/lib/tempo-server
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TEMPO_ADMIN_LOGIN: "${TEMPO_ADMIN_LOGIN:-admin}"
      TEMPO_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  tempo-server-data:

secrets:
  admin_password:
    file: ./secrets/admin_password.txt
