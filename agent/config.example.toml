# Configuração de desenvolvimento do tempo-agent.
database_path = "./var/agent/tempo-agent.db"
controlled_user = "usuario_controlado"
tick_interval = "1s"
checkpoint_interval = "5s"
loginctl_path = "/usr/bin/loginctl"

# Deixe os três valores vazios para iniciar somente em modo offline.
server_url = ""
device_id = ""
device_token = ""
# Legado: aceito em atualizações, mas o servidor orienta o ciclo normal.
heartbeat_interval = "3s"
http_timeout = "8s"
